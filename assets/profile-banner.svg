<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Lemuel Njoroge — Software Engineering</title>
  <desc id="desc">A dark navy technology banner with cyan and violet gradients, subtle grid lines, and the words Build. Learn. Engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#11152b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="42%" r="55%">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8bb8d8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <circle cx="1000" cy="80" r="115" fill="#2563eb" opacity=".16" filter="url(#blur)"/>
  <circle cx="1080" cy="245" r="100" fill="#7c3aed" opacity=".13" filter="url(#blur)"/>
  <g fill="none" stroke="url(#accent)" opacity=".7">
    <circle cx="1010" cy="160" r="92" stroke-width="1.5"/>
    <circle cx="1010" cy="160" r="66" stroke-width="1" stroke-dasharray="5 9"/>
    <path d="M910 160h200M1010 60v200" stroke-width="1" opacity=".45"/>
    <path d="M940 95l140 130M1080 95L940 225" stroke-width="1" opacity=".3"/>
  </g>
  <g transform="translate(82 78)">
    <rect x="0" y="0" width="4" height="150" rx="2" fill="url(#accent)"/>
    <text x="28" y="58" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">LEM﻿UEL NJOROGE</text>
    <text x="30" y="100" fill="#b8c7dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="2.1">SOFTWARE ENGINEERING  /  FRONTEND DEVELOPMENT</text>
    <text x="30" y="142" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="3.4">BUILD  •  LEARN  •  ENGINEER</text>
  </g>
  <g fill="#dbeafe" opacity=".7">
    <circle cx="865" cy="72" r="2"/><circle cx="1124" cy="118" r="2"/><circle cx="895" cy="260" r="2"/><circle cx="1150" cy="245" r="2"/>
  </g>
</svg>